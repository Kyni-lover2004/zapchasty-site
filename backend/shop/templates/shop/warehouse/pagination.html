{% if page.has_other_pages %}
<nav class="warehouse-pagination" aria-label="Страницы">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">← Назад</a>{% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Дальше →</a>{% endif %}
</nav>
{% endif %}
