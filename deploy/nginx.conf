# Этот server подключается только после настройки TLS-сертификата.
server {
    listen 443 ssl;
    server_name shop.example.ru;
    ssl_certificate /etc/letsencrypt/live/shop.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.ru/privkey.pem;
    client_max_body_size 32m;
    location /assets/ { alias /srv/z62/assets/; }
    location /static/ { alias /srv/z62/staticfiles/; }
    location /media/ {
        alias /srv/z62/media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/(admin|warehouse)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        error_page 403 =404 @staff_not_found;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    location @staff_not_found { return 404; }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
server {
    listen 80;
    server_name shop.example.ru;
    location ~ ^/(admin|warehouse)(/|$) { return 404; }
    location / { return 301 https://$host$request_uri; }
}
